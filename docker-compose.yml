services:
  # 1. PostgreSQL Relational Database Service
  postgres:
    image: postgres:16-alpine
    container_name: sales_intel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sales_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Sales Intelligence Node.js / TypeScript Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_intel_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/sales_intelligence?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/sales_intelligence?schema=public
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
    driver: local
